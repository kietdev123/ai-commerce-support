name: ai-commerce-support

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  medusa:
    build:
      context: ./web-ecom
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000,http://localhost:5173
      AUTH_CORS: http://localhost:9000,http://localhost:5173,http://localhost:8000
      JWT_SECRET: local-jwt-secret-change-before-production
      COOKIE_SECRET: local-cookie-secret-change-before-production
      MEDUSA_ADMIN_EMAIL: admin@aicommerce.local
      MEDUSA_ADMIN_PASSWORD: supersecret
      STOREFRONT_API_KEY_FILE: /runtime/publishable-api-key
    command: ["./scripts/start-backend.sh"]
    ports:
      - "9000:9000"
      - "5173:5173"
    volumes:
      - storefront_runtime:/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  storefront:
    build:
      context: ./web-ecom
    environment:
      NODE_ENV: development
      MEDUSA_BACKEND_URL: http://medusa:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_DEFAULT_REGION: vn
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      STOREFRONT_API_KEY_FILE: /runtime/publishable-api-key
      OPEN_WEBUI_URL: http://open-webui:8080
      OPEN_WEBUI_API_KEY_FILE: /ai-runtime/open-webui-api-key
      OPEN_WEBUI_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen3:1.7b}
    command: ["./scripts/start-storefront.sh"]
    ports:
      - "8000:8000"
    volumes:
      - storefront_runtime:/runtime:ro
      - ai_integration_runtime:/ai-runtime:ro
    depends_on:
      medusa:
        condition: service_healthy
      open-webui-integration-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.33.2
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:0.33.2
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS: ${OLLAMA_MODELS:-qwen3:1.7b,llama3.2:1b}
    volumes:
      - ./ai-platform/ollama/init-models.sh:/scripts/init-models.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-models.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.1-slim
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "False"
      WEBUI_SECRET_KEY: local-open-webui-secret-change-before-production
      WEBUI_NAME: AI Commerce Support
      DEFAULT_MODELS: ${OLLAMA_DEFAULT_MODEL:-qwen3:1.7b}
      ENABLE_SIGNUP: "False"
      ENABLE_API_KEYS: "True"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "True"
      API_KEYS_ALLOWED_ENDPOINTS: /api/models,/api/chat/completions
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  open-webui-integration-init:
    image: ghcr.io/open-webui/open-webui:v0.11.1-slim
    environment:
      OPEN_WEBUI_URL: http://open-webui:8080
      OPEN_WEBUI_API_KEY_FILE: /runtime/open-webui-api-key
    volumes:
      - ./ai-platform/open-webui/init-integration.py:/scripts/init-integration.py:ro
      - ai_integration_runtime:/runtime
    entrypoint: ["python", "/scripts/init-integration.py"]
    depends_on:
      open-webui:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  storefront_runtime:
  ollama_models:
  open_webui_data:
  ai_integration_runtime:
